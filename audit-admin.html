<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>Audit · OLYMP SHOP Admin</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root{--line:rgba(142,198,232,.2);--muted:#b4bec8;--text:#edf3fb;--accent:#8ec6e8;--error:#ff8f8f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0b0d10;color:var(--text);font:16px/1.5 system-ui,sans-serif}
    main{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
    .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}.topbar strong{font-size:.9rem}.back{margin-left:auto;color:var(--text);font-weight:650;text-decoration:none}
    h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.7rem);line-height:1.15}.lead,.meta{color:var(--muted);line-height:1.6}
    .panel{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(21,25,29,.96),rgba(10,12,14,.96));padding:20px;margin-top:20px}
    .filters{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(160px,.7fr) minmax(120px,.4fr) auto;gap:12px;align-items:end}
    .field{display:grid;gap:6px;min-width:0}.field label{font-weight:650}
    input,select,button{min-height:44px;padding:9px 12px;border:1px solid rgba(142,198,232,.24);border-radius:9px;background:#101418;color:var(--text);font:inherit}
    button{font-weight:700;cursor:pointer;background:var(--accent);border-color:var(--accent);color:#091116}button:disabled{opacity:.58;cursor:wait}
    :focus-visible{outline:3px solid rgba(142,198,232,.65);outline-offset:3px}
    .status{min-height:24px;margin:12px 0 0;color:var(--muted)}.status.error{color:var(--error)}
    .table-wrap{overflow-x:auto;margin-top:12px}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
    td.time{white-space:nowrap;color:var(--muted);font-size:.9rem}
    .badge{display:inline-flex;padding:2px 10px;border:1px solid var(--line);border-radius:999px;color:var(--accent);font-weight:700;font-size:.85rem}
    td.details{color:var(--muted);overflow-wrap:anywhere}
    @media(max-width:760px){.filters{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="/admin/nav.css">
</head>
<body>
  <main>
    <div class="topbar">
      <span class="admin-menu-slot" aria-hidden="true"></span><strong>OLYMP · SHOP ADMIN</strong>
      <span class="admin-menu-hint">Menü links öffnen</span>
      <a class="back" href="/admin/catalog">Shop-Produkte</a>
    </div>
    <h1>Audit</h1>
    <p class="lead">Zentrale Übersicht über Familien-, Ticket-, Coupon-, Familienkassen- und Buchungsaktionen. Die neuesten Einträge stehen oben.</p>
    <section class="panel" aria-labelledby="audit-heading">
      <h2 id="audit-heading" hidden>Audit-Einträge</h2>
      <form id="audit-form" class="filters">
        <div class="field">
          <label for="audit-query">Suche</label>
          <input id="audit-query" type="search" maxlength="100" autocomplete="off" placeholder="Aktion, Name, Admin, Details …">
        </div>
        <div class="field">
          <label for="audit-category">Bereich</label>
          <select id="audit-category">
            <option value="">Alle Bereiche</option>
            <option value="familie">Familien</option>
            <option value="ticket">Tickets</option>
            <option value="coupon">Coupons</option>
            <option value="familienkasse">Familienkassen</option>
            <option value="buchung">Buchungen</option>
          </select>
        </div>
        <div class="field">
          <label for="audit-limit">Anzahl</label>
          <select id="audit-limit">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
        </div>
        <button id="audit-reload" type="submit">Aktualisieren</button>
      </form>
      <p id="audit-status" class="status" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Zeit</th><th>Bereich</th><th>Aktion</th><th>Betroffen</th><th>Ausgeführt von</th><th>Details</th></tr></thead>
          <tbody id="audit-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/admin/audit.js"></script>
  <script src="/admin/nav.js"></script>
</body>
</html>
