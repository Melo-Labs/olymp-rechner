<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07080a"><link rel="icon" href="/img/Ischia-famq.png" type="image/png"><title>OLYMP Shop · Ausrüstung & Bestellungen</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/shop.css"><style>:root{--shop-bg:var(--bg,#07080a);--shop-surface:var(--surface,#12151a);--shop-surface-raised:var(--surface-2,#181c23);--shop-surface-hover:var(--surface-3,#1e2430);--shop-line:rgba(126,184,224,.2);--shop-line-soft:var(--line,rgba(255,255,255,.07));--shop-text:var(--tx,#f2f4f6);--shop-muted:var(--mut,#7e8692);--shop-blue:#7eb8e0;--shop-blue-dim:#4b94b6;--shop-gold:#e0b35c;--shop-gold-border:#c49a45;--shop-green:var(--ok,#5dce9a);--shop-red:var(--bad,#ff7a7a);--shop-pink:#ff8299;--shop-radius:14px;--shop-radius-sm:10px;--shop-space:12px;--shop-display:var(--display);--shop-body:var(--body)}*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth;scroll-padding-top:132px}body{margin:0;min-width:320px;min-height:100vh;background:var(--shop-bg);color:var(--shop-text);font:14px/1.45 var(--shop-body);-webkit-font-smoothing:antialiased}body>.bg{opacity:.36}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}:focus-visible{outline:2px solid var(--shop-blue);outline-offset:3px}.shop-shell{position:relative;min-height:100vh;background:radial-gradient(ellipse 75% 52% at 48% -8%,rgba(64,105,126,.16),transparent 70%),linear-gradient(180deg,#0a0e12 0,var(--shop-bg) 420px)}.site-header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--shop-bg) 88%,transparent);border-bottom:1px solid var(--shop-line);backdrop-filter:blur(18px) saturate(1.15)}.header-inner,.main-inner{width:min(1376px,calc(100% - 56px));margin:0 auto}.topbar{display:grid;grid-template-columns:minmax(170px,218px) minmax(180px,1fr) auto;align-items:center;gap:18px;min-height:76px}.brand{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none}.brand-logo{width:46px;height:46px;flex:0 0 auto;object-fit:cover;border:1px solid rgba(126,184,224,.55);border-radius:14px;background:#000}.brand-wordmark{display:grid;gap:2px}.brand-wordmark strong{color:#fff;font:700 13px/1.2 var(--shop-display);letter-spacing:.08em;white-space:nowrap}.brand-wordmark span{color:var(--shop-muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}.search-box{display:flex;align-items:center;gap:10px;min-width:0;height:44px;padding:0 12px;border:1px solid rgba(126,184,224,.22);border-radius:var(--shop-radius-sm);background:var(--shop-surface-raised);color:var(--shop-blue)}.search-box:focus-within{border-color:var(--shop-blue);box-shadow:0 0 0 3px rgba(126,184,224,.1)}.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--shop-text);font-size:13px}.header-actions{display:flex;align-items:center;gap:8px}.header-action,.header-home{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 11px;border:1px solid rgba(255,255,255,.12);border-radius:var(--shop-radius-sm);background:rgba(255,255,255,.025);color:var(--shop-text);font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap}.header-action:hover,.header-home:hover{border-color:rgba(126,184,224,.5);background:rgba(126,184,224,.06)}.shop-nav{display:flex;align-items:center;gap:24px;min-height:43px;border-top:1px solid rgba(255,255,255,.06)}.shop-nav a{display:inline-flex;align-items:center;min-height:42px;border-bottom:2px solid transparent;color:#c0c7cd;font-size:11px;font-weight:600;text-decoration:none}.shop-nav a:hover,.shop-nav a[aria-current=page]{border-color:var(--shop-blue);color:#fff}.main-inner{padding:25px 0 36px}h1{margin:0;color:#f3f5f6;font:700 25px/1.2 var(--shop-display)}.shop-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;align-items:start;gap:25px}.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.shop-product{position:relative;display:flex;min-width:0;flex-direction:column;padding:9px;border:1px solid rgba(126,184,224,.13);border-radius:var(--shop-radius-sm);background:linear-gradient(180deg,rgba(17,24,30,.95),rgba(10,14,18,.98));transition:border-color .17s,transform .17s,box-shadow .17s}.shop-product:hover{border-color:rgba(126,184,224,.33);transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.35)}.btn-gold{min-height:37px;padding:0 13px;border:1px solid var(--shop-gold-border);border-radius:var(--shop-radius-sm);background:var(--shop-gold);color:#1a1a14;font-size:10px;font-weight:700;white-space:nowrap}.btn-gold:hover:not(:disabled){filter:brightness(1.05)}.cart-panel{padding:13px 14px;border:1px solid rgba(126,184,224,.24);border-radius:var(--shop-radius);background:linear-gradient(155deg,rgba(18,28,35,.96),rgba(9,13,17,.98));box-shadow:0 8px 24px rgba(0,0,0,.3)}@media (max-width:1100px){.shop-layout{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.side-rail{position:static}}@media (max-width:720px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{grid-template-columns:1fr;min-height:auto;padding:12px 0;gap:12px}}</style></head><body><div class="shop-shell"><p style="padding:40px;text-align:center;color:#ccc">Shop wird geladen… Bitte Seite neu laden oder Datei aus dem Repo-Backup wiederherstellen.</p></div><script src="/bg.js"></script><script src="/freie-bestellung.js"></script></body></html>
