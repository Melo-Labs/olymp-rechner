<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ankauf-Angebot</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root{--text:#ececec;--muted:#9a9da3;--a:#d7ad72;--green:#7ee0a6;--red:#ff7b7b;--br:rgba(215,173,114,.5)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
    .wrap{width:min(960px,calc(100% - 32px));margin:0 auto;padding:clamp(28px,6vw,64px) 0 72px}
    .topbar{display:flex;align-items:center;gap:16px;margin-bottom:22px}
    .brand-logo{width:64px;height:64px;object-fit:cover;border-radius:50%;border:1px solid rgba(215,173,114,.5);background:#000;box-shadow:0 0 28px rgba(215,173,114,.18)}
    .back{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding:10px 14px;border:1px solid rgba(228,232,238,.16);border-radius:6px;background:rgba(255,255,255,.03);color:var(--text);font-weight:700;text-decoration:none;transition:border-color .2s,box-shadow .2s}
    .back:hover{border-color:var(--a);box-shadow:0 0 18px -6px rgba(215,173,114,.5)}
    .back:focus-visible{outline:2px solid var(--a);outline-offset:3px}
    h1{margin:0 0 14px;font:900 clamp(2rem,6vw,4rem)/1.05 var(--display);letter-spacing:.05em;text-shadow:0 0 20px rgba(215,173,114,.3)}
    .lead{margin:0;max-width:62ch;color:var(--muted);line-height:1.6;font-size:clamp(1rem,1.5vw,1.15rem)}
    .card{position:relative;margin-top:28px;max-width:760px;padding:28px 26px 24px;border:1px solid rgba(215,173,114,.18);border-radius:6px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 30px 50px -34px rgba(0,0,0,.9);background:linear-gradient(var(--br),var(--br)) 0 0/14px 1px no-repeat,linear-gradient(var(--br),var(--br)) 0 0/1px 14px no-repeat,linear-gradient(var(--br),var(--br)) 100% 0/14px 1px no-repeat,linear-gradient(var(--br),var(--br)) 100% 0/1px 14px no-repeat,linear-gradient(var(--br),var(--br)) 0 100%/14px 1px no-repeat,linear-gradient(var(--br),var(--br)) 0 100%/1px 14px no-repeat,linear-gradient(var(--br),var(--br)) 100% 100%/14px 1px no-repeat,linear-gradient(var(--br),var(--br)) 100% 100%/1px 14px no-repeat,linear-gradient(165deg,rgba(27,29,33,.82),rgba(11,12,14,.9))}
    .card h2{margin:0 0 16px;font:700 1.25rem/1.2 var(--display);letter-spacing:.05em}
    form{display:grid;gap:18px;margin-top:8px}
    .field{display:grid;gap:8px}
    label{font-size:1rem;font-weight:600;color:rgba(236,236,236,.92)}
    input,textarea{width:100%;padding:15px 16px;border-radius:6px;border:1px solid rgba(228,232,238,.16);background:rgba(0,0,0,.38);color:var(--text);font:inherit;font-size:1.05rem;transition:border-color .2s,box-shadow .2s}
    textarea{min-height:150px;resize:vertical;line-height:1.5}
    input:hover,textarea:hover{border-color:rgba(215,173,114,.55)}
    input:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(215,173,114,.14),0 0 24px -6px rgba(215,173,114,.4)}
    .hint{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
    .cta{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:15px 18px;border:0;border-radius:6px;background:linear-gradient(135deg,#f3dfc2,#c29a63);color:#0a0a0b;font:700 .95rem var(--display);letter-spacing:.08em;cursor:pointer;transition:box-shadow .25s,transform .2s}
    .cta:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(215,173,114,.4)}
    .cta:disabled{cursor:wait;opacity:.65;transform:none}
    .status{min-height:24px;font-size:.92rem;color:var(--muted);font-weight:600}
    .status.error{color:var(--red)}.status.success{color:var(--green)}
    @media (max-width:760px){.card{padding:22px 16px 18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <img class="brand-logo" src="/img/Ischia-famq.png" alt="Ischia FamQ Logo">
      <a class="back" href="/" aria-label="Zur Startseite">⌂ <span>Startseite</span></a>
    </div>

    <h1>Ankauf</h1>
    <p class="lead">Was möchtest du an uns verkaufen? Beschreibe die Gegenstände und ihre Menge. Wir melden uns bei dir, um die Details und den Preis zu besprechen.</p>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Dein Angebot</h2>
      <form id="sell-offer-form">
        <div class="field">
          <label for="offer">Gegenstände und Menge</label>
          <textarea id="offer" name="offer" maxlength="2000" placeholder="Zum Beispiel: 20x Metall, 5x Werkzeug (Zustand: gebraucht)" required></textarea>
          <p class="hint">Gib bitte möglichst genau an, was und wie viel du verkaufen möchtest. Ankaufspreise werden später ergänzt.</p>
        </div>

        <div class="field">
          <label for="ic-name">IC-Name</label>
          <input id="ic-name" name="icName" type="text" maxlength="80" autocomplete="name" placeholder="Dein IC-Name" required>
        </div>

        <div class="field">
          <label for="phone">Telefonnummer</label>
          <input id="phone" name="phone" type="tel" maxlength="40" autocomplete="tel" placeholder="Deine Telefonnummer" required>
        </div>

        <button class="cta" type="submit">Ankauf-Angebot senden</button>
        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </section>
  </main>
  <script src="/bg.js"></script>
  <script src="/ankauf.js"></script>
</body>
</html>
