<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STANK Kauf</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/forms.css">
  <style>
    :root {
      --page-accent: var(--ok, #5dce9a);
      --page-accent-soft: rgba(93, 206, 154, 0.12);
    }
    .brand-logo, .order-logo {
      border-color: color-mix(in srgb, var(--page-accent) 40%, var(--line));
      border-radius: 14px;
    }
    .card { border-color: color-mix(in srgb, var(--page-accent) 22%, var(--line)); }
    .highlight { color: var(--page-accent); }
    .summary { border-color: color-mix(in srgb, var(--page-accent) 30%, var(--line)); background: var(--page-accent-soft); }
    .cta { background: var(--page-accent); color: #0a1610; }
    input:focus, .quantity-control button:hover { border-color: var(--page-accent); }
    input:focus { box-shadow: 0 0 0 3px var(--page-accent-soft); }
    .coupon-entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 8px; }
    .coupon-entry label { display: grid; gap: 6px; font-size: .9rem; font-weight: 600; }
    .coupon-entry input { min-width: 0; min-height: 44px; }
    .coupon-entry button { min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-elevated); color: var(--tx); font: inherit; font-weight: 700; }
    .coupon-entry button:hover:not(:disabled) { border-color: var(--page-accent); }
    .coupon-entry button:disabled { opacity: .58; cursor: not-allowed; }
    .coupon-discount { color: var(--ok); }
    @media (max-width: 420px) { .coupon-entry { grid-template-columns: 1fr; } .coupon-entry button { width: 100%; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <img class="brand-logo" src="/img/Ischia-famq.png" alt="Ischia FamQ Logo">
      <a class="back" href="/" aria-label="Zur Startseite">⌂ <span>Startseite</span></a>
    </div>
    <h1>STANK Kauf</h1>
    <p class="lead">Bestelle STANK-Pflanzen für 2.000 $ pro Stück. Der Gesamtpreis wird automatisch berechnet.</p>

    <div class="form-shell">
      <section class="card">
        <div class="order-header">
          <img class="order-logo" src="/img/Ischia-famq.png" alt="Ischia FamQ Logo">
          <span class="highlight">Bestellung</span>
        </div>
        <h2>STANK-Pflanzen</h2>
        <form id="stank-order-form">
          <div class="field">
            <label for="stank-quantity">Anzahl STANK-Pflanzen</label>
            <div class="quantity-control">
              <button type="button" data-quantity-step="-1" aria-label="Eine STANK-Pflanze weniger">−</button>
              <input id="stank-quantity" name="quantity" type="number" min="1" step="1" value="1" required>
              <button type="button" data-quantity-step="1" aria-label="Eine STANK-Pflanze mehr">+</button>
            </div>
          </div>
          <div class="field">
            <label for="stank-ic-name">IC-Name</label>
            <input id="stank-ic-name" name="icName" type="text" maxlength="80" autocomplete="name" placeholder="Dein IC-Name" required>
          </div>
          <div class="field">
            <label for="stank-phone">Handynummer / IC</label>
            <input id="stank-phone" name="phone" type="tel" maxlength="40" placeholder="Deine IC-Handynummer" required>
          </div>
          <div class="summary">
            <div class="summary-row"><span>STANK-Pflanzen</span><strong id="stank-summary-quantity">1 × 2.000 $</strong></div>
            <div class="summary-row"><span>Zwischensumme</span><strong id="stank-summary-subtotal">2.000 $</strong></div>
            <div id="stank-coupon-row" class="summary-row coupon-discount" hidden><span>Coupon-Rabatt</span><strong id="stank-coupon-discount">0 $</strong></div>
            <div class="summary-total"><span>Endpreis</span><strong id="stank-summary-total">2.000 $</strong></div>
          </div>
          <div class="coupon-entry">
            <label for="stank-coupon-code">Rabattcode
              <input id="stank-coupon-code" name="couponCode" type="text" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code eingeben">
            </label>
            <button id="apply-stank-coupon" type="button">Einlösen</button>
          </div>
          <p id="stank-coupon-feedback" class="status" role="status" aria-live="polite"></p>
          <button class="cta" type="submit">STANK bestellen</button>
          <div id="stank-status" class="status" aria-live="polite"></div>
        </form>
      </section>
    </div>
  </main>
  <script src="/bg.js"></script>
  <script src="/stank-kauf.js"></script>
</body>
</html>
